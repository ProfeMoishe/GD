<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Geometry Dash - IPET 249</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #FFE600; /* Amarillo del escudo */
            font-family: 'Arial Black', Impact, sans-serif;
            touch-action: none; /* Evita el zoom en móviles */
        }
        canvas {
            display: block;
        }
        #ui {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            pointer-events: none;
        }
        #game-over {
            display: none;
            background-color: rgba(0, 0, 0, 0.8);
            color: #FFE600;
            padding: 20px 40px;
            border-radius: 15px;
            border: 5px solid #E3000F; /* Rojo del escudo */
            text-align: center;
            pointer-events: auto;
            cursor: pointer;
        }
        h1 {
            color: #E3000F;
            text-shadow: 3px 3px 0px #000;
            font-size: 2.5rem;
            margin-bottom: 10px;
        }
        p {
            color: #000;
            font-size: 1.2rem;
            margin: 5px;
        }
    </style>
</head>
<body>

    <!-- Música de fondo -->
    <audio id="bg-music" loop>
        <source src="musica.mp3" type="audio/mpeg">
    </audio>

    <canvas id="gameCanvas"></canvas>

    <div id="ui">
        <div id="game-over">
            <h1>¡CRASH!</h1>
            <p>Toca o haz clic para reiniciar</p>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const bgMusic = document.getElementById('bg-music');
        const gameOverScreen = document.getElementById('game-over');

        // Ajustar tamaño del canvas
        function resize() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resize);
        resize();

        // Variables del juego
        let gameState = 'start'; // start, playing, gameover
        let score = 0;
        let speed = 6;
        let gravity = 0.6;
        let jumpPower = -11;
        let groundY = canvas.height - 80;

        // Imagen del escudo
        const playerImg = new Image();
        playerImg.src = 'escudo.png'; // Asegúrate de subir esta imagen

        // Jugador (El escudo)
        const player = {
            x: 100,
            y: groundY - 50,
            size: 50,
            dy: 0,
            isGrounded: true
        };

        // Obstáculos
        let obstacles = [];
        let spawnTimer = 0;
        let spawnInterval = 90; // Frames entre obstáculos

        // Controles
        function jump() {
            if (gameState === 'start') {
                gameState = 'playing';
                bgMusic.play().catch(e => console.log("Audio bloqueado por el navegador"));
            }
            
            if (gameState === 'playing' && player.isGrounded) {
                player.dy = jumpPower;
                player.isGrounded = false;
            }
        }

        function resetGame() {
            gameState = 'playing';
            score = 0;
            speed = 6;
            obstacles = [];
            player.y = groundY - player.size;
            player.dy = 0;
            player.isGrounded = true;
            spawnTimer = 0;
            gameOverScreen.style.display = 'none';
            bgMusic.currentTime = 0;
            bgMusic.play().catch(e => console.log(e));
        }

        window.addEventListener('keydown', (e) => {
            if (e.code === 'Space' || e.code === 'ArrowUp') {
                if (gameState === 'gameover') resetGame();
                else jump();
            }
        });

        window.addEventListener('mousedown', () => {
            if (gameState === 'gameover') resetGame();
            else jump();
        });
        
        window.addEventListener('touchstart', (e) => {
            e.preventDefault();
            if (gameState === 'gameover') resetGame();
            else jump();
        }, {passive: false});

        // Generador de obstáculos
        function spawnObstacle() {
            // Alternar entre pinchos (rojo) y bloques (negro)
            const type = Math.random() > 0.5 ? 'spike' : 'block';
            const width = type === 'spike' ? 40 : 50;
            const height = type === 'spike' ? 40 : 50;
            
            obstacles.push({
                x: canvas.width,
                y: groundY - height,
                width: width,
                height: height,
                type: type
            });
        }

        // Detección de colisiones (AABB)
        function checkCollision(rect1, rect2) {
            return (
                rect1.x < rect2.x + rect2.width &&
                rect1.x + rect1.size > rect2.x &&
                rect1.y < rect2.y + rect2.height &&
                rect1.y + rect1.size > rect2.y
            );
        }

        // Dibujar formas
        function drawSpike(x, y, width, height) {
            ctx.fillStyle = '#E3000F'; // Rojo
            ctx.strokeStyle = '#000';
            ctx.lineWidth = 4;
            ctx.beginPath();
            ctx.moveTo(x, y + height);
            ctx.lineTo(x + width / 2, y);
            ctx.lineTo(x + width, y + height);
            ctx.closePath();
            ctx.fill();
            ctx.stroke();
        }

        function drawBlock(x, y, width, height) {
            ctx.fillStyle = '#E3000F'; // Rojo
            ctx.strokeStyle = '#000';
            ctx.lineWidth = 4;
            ctx.fillRect(x, y, width, height);
            ctx.strokeRect(x, y, width, height);
            // Detalle interior
            ctx.fillStyle = '#FFE600';
            ctx.fillRect(x + 10, y + 10, width - 20, height - 20);
        }

        // Loop principal
        function update() {
            if (gameState === 'playing') {
                // Física del jugador
                player.dy += gravity;
                player.y += player.dy;

                // Colisión con el suelo
                if (player.y + player.size >= groundY) {
                    player.y = groundY - player.size;
                    player.dy = 0;
                    player.isGrounded = true;
                }

                // Generar obstáculos
                spawnTimer++;
                if (spawnTimer > spawnInterval) {
                    spawnObstacle();
                    spawnTimer = 0;
                    // Dificultad progresiva
                    if (spawnInterval > 50) spawnInterval -= 0.5;
                    if (speed < 15) speed += 0.001;
                }

                // Mover y evaluar obstáculos
                for (let i = obstacles.length - 1; i >= 0; i--) {
                    let obs = obstacles[i];
                    obs.x -= speed;

                    // Colisión
                    if (checkCollision(player, obs)) {
                        // Si es un bloque, permitir aterrizar encima
                        if (obs.type === 'block' && player.dy > 0 && player.y + player.size - player.dy <= obs.y + 10) {
                            player.y = obs.y - player.size;
                            player.dy = 0;
                            player.isGrounded = true;
                        } else {
                            // Muerte
                            gameState = 'gameover';
                            gameOverScreen.style.display = 'block';
                            bgMusic.pause();
                        }
                    }

                    // Eliminar fuera de pantalla
                    if (obs.x + obs.width < 0) {
                        obstacles.splice(i, 1);
                        score += 10;
                    }
                }
            }

            // Dibujar todo
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Suelo
            ctx.fillStyle = '#000';
            ctx.fillRect(0, groundY, canvas.width, canvas.height - groundY);
            
            // Línea de suelo amarilla para dar estilo
            ctx.fillStyle = '#FFE600';
            ctx.fillRect(0, groundY, canvas.width, 5);

            // Dibujar obstáculos
            obstacles.forEach(obs => {
                if (obs.type === 'spike') {
                    drawSpike(obs.x, obs.y, obs.width, obs.height);
                } else {
                    drawBlock(obs.x, obs.y, obs.width, obs.height);
                }
            });

            // Dibujar jugador (Escudo)
            if (playerImg.complete && playerImg.naturalHeight !== 0) {
                // Si la imagen cargó, dibujarla
                ctx.drawImage(playerImg, player.x, player.y, player.size, player.size);
                // Borde negro alrededor del escudo
                ctx.strokeStyle = '#000';
                ctx.lineWidth = 3;
                ctx.strokeRect(player.x, player.y, player.size, player.size);
            } else {
                // Fallback si no hay imagen
                ctx.fillStyle = '#FFE600';
                ctx.strokeStyle = '#000';
                ctx.lineWidth = 4;
                ctx.fillRect(player.x, player.y, player.size, player.size);
                ctx.strokeRect(player.x, player.y, player.size, player.size);
                // Engranaje simple
                ctx.fillStyle = '#E3000F';
                ctx.beginPath();
                ctx.arc(player.x + 25, player.y + 25, 15, 0, Math.PI * 2);
                ctx.fill();
            }

            // Texto de puntuación
            ctx.fillStyle = '#000';
            ctx.font = 'bold 30px Arial';
            ctx.fillText('Puntos: ' + score, 20, 50);

            if (gameState === 'start') {
                ctx.fillStyle = 'rgba(0,0,0,0.7)';
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                ctx.fillStyle = '#FFE600';
                ctx.font = 'bold 50px Arial';
                ctx.textAlign = 'center';
                ctx.fillText('IPET 249', canvas.width/2, canvas.height/2 - 50);
                ctx.fillStyle = '#E3000F';
                ctx.font = 'bold 30px Arial';
                ctx.fillText('Toca o presiona ESPACIO para empezar', canvas.width/2, canvas.height/2 + 20);
                ctx.textAlign = 'left'; // Reset
            }

            requestAnimationFrame(update);
        }

        // Iniciar loop
        update();

    </script>
</body>
</html>
